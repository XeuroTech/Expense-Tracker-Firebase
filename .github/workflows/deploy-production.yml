name: Deploy Backend - Production

# Deploys backend (Cloud Functions + Firestore rules/indexes + Storage
# rules) to the PRODUCTION Firebase project (expense-tracker-b8db9).
#
# Deliberately manual-only (workflow_dispatch) — production deploys must
# never happen automatically on a push. Run this from the Actions tab
# after the change has been verified on the testing project via
# deploy-testing.yml.
#
# One-time setup needed before this workflow can run: create a service
# account scoped to expense-tracker-b8db9, grant it Firebase Admin +
# Service Account User, download its JSON key, and save that key as a
# GitHub repo secret named FIREBASE_PRODUCTION_SA_KEY (Settings -> Secrets
# and variables -> Actions -> New repository secret). Optionally protect
# the "production" environment below with required reviewers (Settings ->
# Environments) so a deploy needs explicit approval.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_PRODUCTION_SA_KEY }}

      - name: Deploy backend to production project
        run: npx firebase-tools@latest deploy --only functions,firestore:rules,firestore:indexes,storage --project expense-tracker-b8db9 --non-interactive
